# Spring Boot Configuration
spring.application.name=TelegramBot
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coffee_bot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Telegram Bot Configuration
bot.name=${BOT_NAME:CoffeeBot}
bot.token=${BOT_TOKEN:your-bot-token-here}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.SpringBot=DEBUG
logging.level.org.telegram.telegrambots=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
